name: Bug report
description: Something in Anchor didn't work the way it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        **Do not report security issues here** — use a private security advisory instead: <https://github.com/Hans-Tandt/Anchor/security/advisories/new>

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, short description of the bug.
      placeholder: Anchor did X, but I expected Y.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered steps someone else could follow to hit the same bug.
      placeholder: |
        1. Open Anchor
        2. Create a profile with source X and destination Y
        3. Click "Run backup now"
        4. …
    validations:
      required: true

  - type: input
    id: anchor-version
    attributes:
      label: Anchor version
      description: Shown in the window title bar.
      placeholder: e.g. 1.1.0
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Settings → System → About → Windows specifications.
      placeholder: e.g. Windows 11 Pro 24H2 (10.0.26100)
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version (only if running from source)
      description: Output of `python --version`.
      placeholder: e.g. Python 3.12.5

  - type: textarea
    id: logs
    attributes:
      label: Relevant log excerpt
      description: |
        The interesting lines from `logs/anchor-YYYYMM.log` (or `%APPDATA%\Anchor\logs\`).
        Please redact any private paths or file names before pasting.
      render: text
      placeholder: |
        2026-05-23 09:29:23 [INFO] ─── Backup 'Test' (id=…) ───
        …

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, `diagnose.py --check <path>` output, related issues, etc.
